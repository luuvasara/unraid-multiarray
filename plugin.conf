# plugin.conf - what the shared plugin kit needs to know about this plugin.
NAME=multiarray
TITLE="Multi Arrays"
SUMMARY="Proof of concept: run more than one independent Unraid array on one server, each with its own Main tab. Not for production servers."
PARENT=MultiArray
ABOUT_ORDER=1
REPO=https://github.com/luuvasara/unraid-multiarray
EXEC="usr/local/emhttp/plugins/multiarray/scripts/gen-pages usr/local/emhttp/plugins/multiarray/scripts/inst-run usr/local/emhttp/plugins/multiarray/scripts/kmod-dispatch usr/local/emhttp/plugins/multiarray/scripts/lib.sh usr/local/emhttp/plugins/multiarray/scripts/multiarray usr/local/emhttp/plugins/multiarray/event/any_event usr/local/emhttp/plugins/multiarray/event/started usr/local/emhttp/plugins/multiarray/event/stopping usr/local/emhttp/plugins/multiarray/seed/noop"
